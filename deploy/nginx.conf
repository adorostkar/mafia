server {
    listen 80;
    listen [::]:80;
    server_name mafia.dorostkar.net;

    return 308 https://mafia.dorostkar.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mafia.dorostkar.net;

    ssl_certificate /etc/ssl/cert.pem;
    ssl_certificate_key /etc/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/mafia-cloudflare-realip.conf;

    access_log /var/log/nginx/mafia.access.log;
    error_log /var/log/nginx/mafia.error.log warn;
    client_max_body_size 32k;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host mafia.dorostkar.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";

        proxy_cache off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
}
